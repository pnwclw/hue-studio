name: Docs

on:
  push:
    branches: [dev]
    paths:
      - docs/**
      - mkdocs.yml
      - scripts/mkdocs_services.py
      - custom_components/hue_studio/services.yaml
      - custom_components/hue_studio/translations/en.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - scripts/mkdocs_services.py
      - custom_components/hue_studio/services.yaml
      - custom_components/hue_studio/translations/en.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --only-group docs
      - run: uv run --no-sync mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
