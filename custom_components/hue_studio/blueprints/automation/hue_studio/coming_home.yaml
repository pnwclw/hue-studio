blueprint:
  name: "Hue Studio: Coming home"
  description: >-
    Like the Hue app's coming home: the lights go on when the first person arrives. Made for Hue Studio: create and edit it in the Hue Studio panel
    ([Automations](/hue/automations)); this form edits it too.
  domain: automation
  author: Hue Studio
  source_url: https://github.com/pnwclw/hue-studio/blob/main/custom_components/hue_studio/blueprints/automation/hue_studio/coming_home.yaml
  homeassistant:
    min_version: 2026.10.0
  input:
    when_section:
      name: When
      icon: mdi:home-import-outline
      input:
        zone:
          name: Home
          description: The zone whose people count (the home by default).
          default: zone.home
          selector:
            entity:
              filter:
                - domain: zone
        only_dark:
          name: Only after sunset
          default: false
          selector:
            boolean:
    rooms_section:
      name: Rooms
      icon: mdi:sofa-outline
      input:
        rooms:
          name: Rooms
          description: Home Assistant areas; only their Hue lights are used.
          default: []
          selector:
            area:
              multiple: true
              entity:
                - integration: hue
                  domain: light
        zones:
          name: Zones
          description: >-
            Hue rooms and zones (their group lights) that no area above holds, such
            as a zone across several rooms.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - integration: hue
                  domain: light
    light_section:
      name: Light
      icon: mdi:lightbulb-on-outline
      input:
        light:
          name: Light
          description: >-
            A scene of each room, a white, natural light (a white that follows the
            day) or the scene of the day (gallery scenes by time of day, season and
            weather, set up in Hue Studio).
          default: scene
          selector:
            select:
              options:
                - label: Scene
                  value: scene
                - label: White
                  value: white
                - label: Natural light
                  value: natural
                - label: Scene of the day
                  value: auto
        scenes:
          name: Scenes
          description: For "Scene", one scene per room.
          default: []
          selector:
            entity:
              filter:
                - integration: hue
                  domain: scene
              multiple: true
        kelvin:
          name: White
          description: For "White".
          default: 2700
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500
        brightness:
          name: Brightness
          description: For "White", and for "Scene" instead of the scene's own.
          default:
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
        scene_of_the_day:
          name: Natural light and scene of the day
          description: >-
            Phases of the day, scene pools by phase, season and weather, holidays and
            brightness. Easiest to edit in Hue Studio.
          default: {}
          selector:
            object:

mode: single
triggers:
  - trigger: state
    entity_id: !input zone
variables:
  only_dark: !input only_dark
conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state | int(0) == 0
         and trigger.to_state.state | int(0) > 0 }}
  - condition: template
    value_template: "{{ not only_dark or is_state('sun.sun', 'below_horizon') }}"
actions:
  - action: hue_studio.apply_light
    target:
      area_id: !input rooms
      entity_id: !input zones
    data:
      light: !input light
      scenes: !input scenes
      kelvin: !input kelvin
      brightness: !input brightness
      scene_of_the_day: !input scene_of_the_day
      transition: 1
