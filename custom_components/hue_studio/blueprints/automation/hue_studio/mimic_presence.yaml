blueprint:
  name: "Hue Studio: Mimic presence"
  description: >-
    Like the Hue app's mimic presence: while nobody is home, rooms and zones go on and off at random in a time window. Made for Hue Studio: create and edit it in the Hue Studio panel
    ([Automations](/hue/automations)); this form edits it too.
  domain: automation
  author: Hue Studio
  source_url: https://github.com/pnwclw/hue-studio/blob/main/custom_components/hue_studio/blueprints/automation/hue_studio/mimic_presence.yaml
  homeassistant:
    min_version: 2026.10.0
  input:
    when_section:
      name: When
      icon: mdi:home-clock-outline
      input:
        start_kind:
          name: Start
          default: sunset
          selector:
            select:
              options:
                - label: At a time
                  value: time
                - label: At sunset
                  value: sunset
        start_time:
          name: Start time
          default: "19:00:00"
          selector:
            time:
        start_offset:
          name: Sunset offset
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:
              allow_negative: true
        end_time:
          name: End time
          default: "23:30:00"
          selector:
            time:
        days:
          name: Days
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        zone:
          name: Home
          description: The zone whose people count (the home by default).
          default: zone.home
          selector:
            entity:
              filter:
                - domain: zone
        only_away:
          name: Only while nobody is home
          default: true
          selector:
            boolean:
    rooms_section:
      name: Rooms
      icon: mdi:sofa-outline
      input:
        rooms:
          name: Rooms
          description: Home Assistant areas; only their Hue lights are used.
          default: []
          selector:
            area:
              multiple: true
              entity:
                - integration: hue
                  domain: light
        zones:
          name: Zones
          description: >-
            Hue rooms and zones (their group lights) that no area above holds, such
            as a zone across several rooms.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - integration: hue
                  domain: light
    light_section:
      name: Light
      icon: mdi:lightbulb-on-outline
      input:
        light:
          name: Light
          description: >-
            A scene of each room, a white, natural light (a white that follows the
            day) or the scene of the day (gallery scenes by time of day, season and
            weather, set up in Hue Studio).
          default: white
          selector:
            select:
              options:
                - label: White
                  value: white
                - label: Scene
                  value: scene
                - label: Natural light
                  value: natural
                - label: Scene of the day
                  value: auto
        scenes:
          name: Scenes
          description: For "Scene", one scene per room.
          default: []
          selector:
            entity:
              filter:
                - integration: hue
                  domain: scene
              multiple: true
        kelvin:
          name: White
          description: For "White".
          default: 2700
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500
        brightness:
          name: Brightness
          description: For "White", and for "Scene" instead of the scene's own.
          default:
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
        scene_of_the_day:
          name: Natural light and scene of the day
          description: >-
            What this automation adds to Hue Studio's light of the day (its scene pool,
            phases, weather and mood): extra or skipped scenes, its own phase times,
            brightness. Easiest to edit in Hue Studio.
          default: {}
          selector:
            object:

mode: single
triggers:
  - trigger: time
    at: !input start_time
    id: time
  - trigger: sun
    event: sunset
    offset: !input start_offset
    id: sunset
variables:
  start_kind: !input start_kind
  end_time: !input end_time
  days: !input days
  zone: !input zone
  only_away: !input only_away
  rooms: !input rooms
  zones: !input zones
  end_at: >-
    {% set end = today_at(end_time) %}
    {{ (end if end > now() else end + timedelta(days=1)).isoformat() }}
conditions:
  - condition: template
    value_template: "{{ trigger.id == start_kind }}"
  - condition: template
    value_template: "{{ ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][now().weekday()] in days }}"
  - condition: template
    value_template: "{{ not only_away or states(zone) | int(0) == 0 }}"
actions:
  - repeat:
      while:
        - condition: template
          value_template: >-
            {{ now() < as_datetime(end_at)
               and (not only_away or states(zone) | int(0) == 0) }}
      sequence:
        - variables:
            # One room or zone at a time: an area id, or a Hue group light.
            pick: "{{ (rooms + zones) | random }}"
        - action: hue_studio.apply_light
          continue_on_error: true
          target: >-
            {{ {'area_id': [pick]} if pick in rooms else {'entity_id': [pick]} }}
          data:
            light: !input light
            scenes: !input scenes
            kelvin: !input kelvin
            brightness: !input brightness
            scene_of_the_day: !input scene_of_the_day
            transition: 2
            toggle: true
            follow: false
        - wait_template: "{{ only_away and states(zone) | int(0) > 0 }}"
          timeout: "{{ '00:%02d:00' % (range(10, 46) | random) }}"
  - if:
      - condition: template
        value_template: "{{ not only_away or states(zone) | int(0) == 0 }}"
    then:
      - action: hue_studio.apply_light
        target:
          area_id: !input rooms
          entity_id: !input zones
        data:
          light: "off"
          transition: 2
