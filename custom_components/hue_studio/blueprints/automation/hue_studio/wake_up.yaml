blueprint:
  name: "Hue Studio: Wake up with light"
  description: >-
    Like the Hue app's wake-up: the lights fade in and are fully on at the wake-up time, a time of day or one
    from sunrise. Made for Hue Studio: create and edit it in the Hue Studio panel
    ([Automations](/hue/automations)); this form edits it too.
  domain: automation
  author: Hue Studio
  source_url: https://github.com/pnwclw/hue-studio/blob/main/custom_components/hue_studio/blueprints/automation/hue_studio/wake_up.yaml
  homeassistant:
    min_version: 2026.10.0
  input:
    when_section:
      name: When
      icon: mdi:alarm
      input:
        start_kind:
          name: Wake up
          default: time
          selector:
            select:
              options:
                - label: At a time
                  value: time
                - label: With sunrise
                  value: sunrise
        time:
          name: Wake-up time
          default: "07:00:00"
          selector:
            time:
        start_offset:
          name: Offset from sunrise
          description: For "With sunrise"; negative is before it.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:
              allow_negative: true
        days:
          name: Days
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        fade:
          name: Fade in
          description: Minutes before the wake-up time the lights start.
          default: 30
          selector:
            number:
              min: 0
              max: 90
              step: 5
              unit_of_measurement: min
        off_after:
          name: Turn off after
          description: Minutes after the wake-up time (0 keeps them on).
          default: 0
          selector:
            number:
              min: 0
              max: 240
              step: 5
              unit_of_measurement: min
    rooms_section:
      name: Rooms
      icon: mdi:sofa-outline
      input:
        rooms:
          name: Rooms
          description: Home Assistant areas; only their Hue lights are used.
          default: []
          selector:
            area:
              multiple: true
              entity:
                - integration: hue
                  domain: light
        zones:
          name: Zones and lights
          description: >-
            Hue rooms and zones (their group lights) that no area above holds, such
            as a zone across several rooms, and single Hue lights (some of a room's).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - integration: hue
                  domain: light
    light_section:
      name: Light
      icon: mdi:lightbulb-on-outline
      input:
        light:
          name: Light
          description: >-
            A scene of each room, a white, natural light (a white that follows the
            day) or the scene of the day (gallery scenes by time of day, season and
            weather, set up in Hue Studio).
          default: white
          selector:
            select:
              options:
                - label: White
                  value: white
                - label: Scene
                  value: scene
                - label: Natural light
                  value: natural
                - label: Scene of the day
                  value: auto
        scenes:
          name: Scenes
          description: For "Scene", one scene per room.
          default: []
          selector:
            entity:
              filter:
                - integration: hue
                  domain: scene
              multiple: true
        kelvin:
          name: White
          description: For "White".
          default: 2700
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500
        brightness:
          name: Brightness
          description: For "White", and for "Scene" instead of the scene's own.
          default:
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
        scene_of_the_day:
          name: Natural light and scene of the day
          description: >-
            What this automation adds to Hue Studio's light of the day (its scene pool,
            phases, weather and mood): extra or skipped scenes, its own phase times,
            brightness. Easiest to edit in Hue Studio.
          default: {}
          selector:
            object:

mode: single
trigger_variables:
  kind: !input start_kind
  wake_time: !input time
  offset: !input start_offset
  fade_minutes: !input fade
triggers:
  # Fade minutes before the wake-up moment: a time of day, or today's sunrise and the
  # offset (sun.sun names the next sunrise; once today's is past, a day back is close).
  - trigger: template
    value_template: >-
      {% set target = none %}
      {% if kind == 'sunrise' %}
        {% set rise = state_attr('sun.sun', 'next_rising') | as_datetime(none) %}
        {% if rise is not none %}
          {% set rise = rise | as_local %}
          {% if rise.date() > now().date() %}{% set rise = rise - timedelta(days=1) %}{% endif %}
          {% set target = rise + timedelta(hours=offset.hours | default(0) | int(0),
             minutes=offset.minutes | default(0) | int(0)) %}
        {% endif %}
      {% else %}
        {% set target = today_at(wake_time) %}
      {% endif %}
      {{ target is not none and now().strftime('%H:%M')
         == (target - timedelta(minutes=fade_minutes | int(0))).strftime('%H:%M') }}
variables:
  days: !input days
  fade: !input fade
  off_after: !input off_after
conditions:
  - condition: template
    value_template: >-
      {{ ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][(now() + timedelta(minutes=fade | int(0))).weekday()] in days }}
actions:
  - action: hue_studio.apply_light
    target:
      area_id: !input rooms
      entity_id: !input zones
    data:
      light: !input light
      scenes: !input scenes
      kelvin: !input kelvin
      brightness: !input brightness
      scene_of_the_day: !input scene_of_the_day
      transition: "{{ fade | int(0) * 60 }}"
      from_dark: true
  - if:
      - condition: template
        value_template: "{{ off_after | int(0) > 0 }}"
    then:
      - delay:
          minutes: "{{ fade | int(0) + off_after | int(0) }}"
      - action: hue_studio.apply_light
        target:
          area_id: !input rooms
          entity_id: !input zones
        data:
          light: "off"
          transition: 60
