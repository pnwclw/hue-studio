apply_light:
  target:
    area:
    entity:
      integration: hue
      domain: light
  fields:
    light:
      default: scene
      selector:
        select:
          translation_key: light
          options: [scene, white, natural, auto, "off"]
    scenes:
      selector:
        entity:
          integration: hue
          domain: scene
          multiple: true
    kelvin:
      selector:
        color_temp:
          unit: kelvin
          min: 2000
          max: 6500
    brightness:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    transition:
      selector:
        number:
          min: 0
          max: 6000
          unit_of_measurement: s
    scene_of_the_day:
      selector:
        object:
    from_dark:
      default: false
      selector:
        boolean:
    only_if_off:
      default: false
      selector:
        boolean:
    toggle:
      default: false
      selector:
        boolean:
    follow:
      default: true
      selector:
        boolean:
