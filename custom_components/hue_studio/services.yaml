set_sync:
  target:
    entity:
      - integration: hue_studio
      - integration: huesyncbox
  fields:
    power:
      selector:
        boolean:
    sync:
      selector:
        boolean:
    mode:
      selector:
        select:
          options:
            - video
            - music
            - game
          translation_key: sync_mode
    intensity:
      selector:
        select:
          options:
            - subtle
            - moderate
            - high
            - intense
          translation_key: intensity
    input:
      example: input1
      selector:
        text:
    entertainment_area:
      example: TV area
      selector:
        text:
    brightness:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    palette:
      selector:
        select:
          options:
            - happy_energetic
            - happy_calm
            - melancholic_calm
            - melancholic_energetic
            - neutral
          translation_key: music_palette
    background_lighting:
      selector:
        boolean:
    preset:
      example: Movie night
      selector:
        text:

