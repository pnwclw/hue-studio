apply_palette:
  target:
    entity:
      integration: hue
      domain: light
  fields:
    gallery_scene:
      example: ocean_dawn
      selector:
        text:
    points:
      example: "[[0.561, 0.4042], [0.4596, 0.4105]]"
      selector:
        object:
    mirek:
      example: 346
      selector:
        number:
          min: 153
          max: 500
          unit_of_measurement: mired
    brightness:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

set_gradient:
  target:
    entity:
      integration: hue
      domain: light
  fields:
    points:
      required: true
      example: "[[0.561, 0.4042], [0.4596, 0.4105], [0.3227, 0.329]]"
      selector:
        object:
    mode:
      selector:
        select:
          translation_key: gradient_mode
          options:
            - interpolated_palette
            - interpolated_palette_mirrored
            - random_pixelated
            - segmented_palette
    brightness:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

set_effect:
  target:
    entity:
      integration: hue
      domain: light
  fields:
    effect:
      required: true
      selector:
        select:
          translation_key: effect
          options:
            - no_effect
            - candle
            - fire
            - sparkle
            - glisten
            - opal
            - prism
            - underwater
            - cosmos
            - sunbeam
            - enchant
    speed:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    xy_color:
      example: "[0.55, 0.4]"
      selector:
        object:
    mirek:
      selector:
        number:
          min: 153
          max: 500
          unit_of_measurement: mired
    brightness:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

save_scene:
  target:
    entity:
      integration: hue
      domain: scene
  fields:
    name:
      selector:
        text:
    speed:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    auto_dynamic:
      selector:
        boolean:

reset_scene:
  target:
    entity:
      integration: hue
      domain: scene
  fields:
    shuffle:
      default: false
      selector:
        boolean:
    recall:
      default: true
      selector:
        boolean:

recall_scene:
  target:
    entity:
      integration: hue
      domain: scene
  fields:
    dynamic:
      required: true
      selector:
        boolean:
    brightness:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

set_sync:
  target:
    entity:
      integration: hue_studio
  fields:
    power:
      selector:
        boolean:
    sync:
      selector:
        boolean:
    mode:
      selector:
        select:
          options:
            - video
            - music
            - game
          translation_key: sync_mode
    intensity:
      selector:
        select:
          options:
            - subtle
            - moderate
            - high
            - intense
          translation_key: intensity
    input:
      example: input1
      selector:
        text:
    entertainment_area:
      example: TV area
      selector:
        text:
    brightness:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
