<!doctype html>
<!--
  Dev harness for the dashboard cards and the experimental footer: the real extra module
  (hue-studio-extra.js, loaded on every HA page) with a fake `hass` (dev/fixture.ts).
  http://localhost:8765/dev/cards.html?lang=en   (&footer=1 turns the footer on; it shows below 870 px)
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hue Studio cards</title>
  <style>
    html, body { margin: 0; background: #111; color: #fff; font-family: Roboto, sans-serif;
      --card-background-color: #1c1c1e; --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --primary-color: #03a9f4; }
    home-assistant { display: grid; gap: 12px; padding: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr));
      align-items: start; padding-bottom: calc(12px + var(--safe-area-inset-bottom, 0px)); }
  </style>
</head>
<body>
  <script type="module">
    import "../custom_components/hue_studio/frontend/hue-studio-extra.js";
    import { createHass } from "./build/fixture.js";

    customElements.define("home-assistant", class extends HTMLElement {});
    // HA's card frame (only inside HA).
    customElements.define("ha-card", class extends HTMLElement {
      connectedCallback() {
        Object.assign(this.style, { display: "block", background: "var(--card-background-color)", borderRadius: "12px", border: "1px solid #2a2a2a" });
      }
    });
    // <ha-icon> exists only inside HA; render MDI icons from the CDN here (dev only).
    customElements.define("ha-icon", class extends HTMLElement {
      static observedAttributes = ["icon"];
      attributeChangedCallback() {
        const name = (this.getAttribute("icon") || "").replace("mdi:", "");
        fetch(`https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/${name}.svg`)
          .then((r) => r.text())
          .then((svg) => {
            this.innerHTML = svg;
            const el = this.querySelector("svg");
            const size = "var(--mdc-icon-size, 24px)";
            Object.assign(el.style, { width: size, height: size, fill: "currentColor" });
          })
          .catch(() => {});
      }
    });

    const params = new URLSearchParams(location.search);
    const root = document.createElement("home-assistant");
    document.body.append(root);
    const cards = [];
    const hass = createHass({ language: params.get("lang") || "en", onChange: (h) => { root.hass = h; cards.forEach((c) => (c.hass = h)); } });
    root.hass = hass;
    const configs = [
      ["hue-studio-room-card", { area: "office" }],
      ["hue-studio-auto-light-card", { area: "office" }],
      ["hue-studio-gallery-card", {}],
      ["hue-studio-room-card", { area: "living_room" }],
      ["hue-studio-auto-light-card", { area: "kitchen" }],
    ];
    for (const [tag, config] of configs) {
      await customElements.whenDefined(tag);
      const card = document.createElement(tag);
      card.setConfig(config);
      card.hass = hass;
      root.append(card);
      cards.push(card);
    }
    if (params.get("footer")) hass.callWS({ type: "hue_studio/config/set", footer: true, footer_tabs: ["lovelace", "hue", "dashboard-living", "energy"] });
  </script>
</body>
</html>
