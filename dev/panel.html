<!doctype html>
<!--
  Dev harness: renders the panel outside Home Assistant with a fake `hass` (dev/fixture.ts).
  Run `npm run watch` (builds the panel and dev/build/fixture.js), serve the repository root
  (e.g. `python3 -m http.server 8765`) and open
  http://localhost:8765/dev/panel.html?lang=en&path=/room/area.office  (&moreinfo=light.desk_lamp)
  &inset=59,34 fakes a phone's safe areas (HA's --safe-area-inset-top/-bottom, in px);
  &pad=59,34 also pads the panel's slot by them, as HA does without handle_safe_area.
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hue Studio panel</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; }
    home-assistant { display: block; }
  </style>
</head>
<body>
  <script type="module">
    // The real build output, exactly as Home Assistant loads it.
    import "../custom_components/hue_studio/frontend/hue-studio-panel.js";
    import "../custom_components/hue_studio/frontend/hue-studio-more-info.js";
    import { createHass } from "./build/fixture.js";

    // Stand-in for HA's root element: holds `hass` and shows when the stock more-info would open.
    customElements.define("home-assistant", class extends HTMLElement {
      connectedCallback() {
        this.addEventListener("hass-more-info", (e) => console.info("stock more-info:", e.detail.entityId));
      }
    });

    // <ha-icon> exists only inside HA; render MDI icons from the CDN here (dev only).
    customElements.define("ha-icon", class extends HTMLElement {
      static observedAttributes = ["icon"];
      attributeChangedCallback() {
        const name = (this.getAttribute("icon") || "").replace("mdi:", "");
        fetch(`https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/${name}.svg`)
          .then((r) => r.text())
          .then((svg) => {
            this.innerHTML = svg;
            const el = this.querySelector("svg");
            const size = "var(--mdc-icon-size, 24px)";
            Object.assign(el.style, { width: size, height: size, fill: "currentColor" });
          })
          .catch(() => {});
      }
    });

    const params = new URLSearchParams(location.search);
    const panel = document.createElement("hue-studio-panel");
    const narrow = () => window.matchMedia("(max-width: 870px)").matches;
    const root = document.createElement("home-assistant");
    const hass = createHass({ language: params.get("lang") || "en", onChange: (h) => { panel.hass = h; root.hass = h; } });
    root.hass = hass;
    // ?w=430 pins the layout width (headless Chrome windows can't be narrower than ~500px).
    if (params.get("w")) root.style.width = `${params.get("w")}px`;
    // ?pad=59,34: what ha-panel-custom does for panels without handle_safe_area.
    if (params.get("pad")) {
      const [top, bottom = "0"] = params.get("pad").split(",");
      Object.assign(root.style, { paddingTop: `${top}px`, paddingBottom: `${bottom}px` });
    }
    if (params.get("inset")) {
      const [top, bottom = "0"] = params.get("inset").split(",");
      document.documentElement.style.setProperty("--safe-area-inset-top", `${top}px`);
      document.documentElement.style.setProperty("--safe-area-inset-bottom", `${bottom}px`);
    }

    panel.narrow = narrow();
    panel.route = { prefix: "/hue", path: params.get("path") || "" };
    panel.hass = hass;
    window.addEventListener("resize", () => { panel.narrow = narrow(); });
    window.addEventListener("location-changed", () => {
      panel.route = { prefix: "/hue", path: location.pathname.replace(/^\/hue/, "") };
    });
    window.addEventListener("popstate", () => {
      panel.route = { prefix: "/hue", path: location.pathname.replace(/^\/hue/, "") };
    });
    panel.addEventListener("hass-toggle-menu", () => console.info("hass-toggle-menu"));
    root.append(panel);
    document.body.append(root);
    // ?moreinfo=light.desk_lamp opens the more-info override like a dashboard card would.
    if (params.get("moreinfo")) {
      setTimeout(() => panel.dispatchEvent(new CustomEvent("hass-more-info", {
        detail: { entityId: params.get("moreinfo") }, bubbles: true, composed: true,
      })), 300);
    }
  </script>
</body>
</html>
