[project]
name = "hue-studio"
version = "0.1.0"
description = "Home Assistant custom integration: Hue-app-style light control on top of the native Philips Hue integration."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    # Pinned to the Home Assistant release we target (homeassistant==2026.10.0).
    "pytest-homeassistant-custom-component==0.13.371",
    # Same version the native `hue` integration ships with in that release.
    "aiohue==4.9.0",
    # Needed to set up the `frontend` dependency (panel) in tests; HA 2026.10.0 version.
    "home-assistant-frontend==20260930.2",
    # scripts/build_gallery.py
    "pillow",
    "ruff>=0.13",
    "aiohuesyncbox==0.1.6",
]
docs = [
    "mkdocs-material>=9.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.hue_studio"]
combine-as-imports = true
